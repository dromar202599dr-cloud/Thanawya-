<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظّم الثانوية العامة</title>
<style>
:root{--bg:#eef2fb;--card:#fff;--tx:#14213d;--mu:#5b6785;--ac:#1d3fbb;--hl:#ffe14d;--hlt:#14213d;--bad:#b42318;--badbg:#fee4e2;--bd:#d6ddef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--tx:#e8ecf8;--mu:#97a3c4;--ac:#7f9bff;--bad:#ffb4ab;--badbg:#4a1d1a;--bd:#2a3556}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin:0 0 14px}
.card,.prog,.add{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add input[type=text]{grid-column:1/-1}
input,select,button{font:inherit;color:var(--tx)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0;width:100%}
.card input{margin-bottom:8px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px}
.go{grid-column:1/-1;width:100%;background:var(--ac);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.go,.badge{color:#0e1424}}
.bar{height:14px;background:var(--bd);border-radius:7px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--hl);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lnk{background:none;color:var(--mu);padding:4px 8px;font-size:14px;text-decoration:underline}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0 0}
details{margin-top:12px;color:var(--mu)}summary{cursor:pointer;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--bd);font-weight:600;padding:9px 4px}
.tabs button[aria-selected=true]{background:var(--hl);color:var(--hlt);border-color:var(--hl)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;margin-inline-start:4px}
.day{font-weight:700;font-size:14px;color:var(--mu);margin:14px 2px 6px}
.t{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.t input{width:22px;height:22px;accent-color:var(--ac);flex:none;padding:0;margin:0}
.tt{flex:1;min-width:0;overflow-wrap:anywhere}
.t.done .tt{text-decoration:line-through;color:var(--mu)}
.chip{font-size:12px;color:var(--ac);border:1px solid var(--bd);border-radius:8px;padding:0 7px;display:inline-block;margin-top:2px}
.late{font-size:12px;color:var(--bad);margin-inline-start:6px}
.x{background:none;color:var(--mu);padding:4px 8px;font-size:18px}
.mv{background:var(--bg);border:1px solid var(--bd);font-size:12px;padding:4px 8px}
.rescue{background:var(--badbg);border-radius:14px;padding:12px;margin-bottom:10px}
.rescue .row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.rescue input{width:64px;text-align:center}
.rescue .go{width:auto;flex:1}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.st.warn{border-color:var(--bad)}
.st .bar{margin:6px 0}.st .tt div{font-size:14px}
.cd{font-family:monospace;direction:ltr;display:inline-block;background:var(--bg);border-radius:6px;padding:0 8px}
.mini{background:var(--bg);border:1px solid var(--bd);font-size:13px;padding:4px 10px;margin-inline-end:6px}
</style>
</head>
<body>
<main>
<h1>منظّم الثانوية العامة</h1>

<section id="login" class="card">
<p class="sub">اكتب الكود اللي مدرّسك إداهولك.</p>
<input id="cd" type="text" placeholder="الكود" maxlength="12" autocapitalize="characters" autocomplete="off" dir="ltr">
<button class="go" id="lg">دخول</button>
<p class="err" id="le"></p>
<details><summary>دخول المدرّس</summary>
<input id="em" type="email" placeholder="الإيميل" dir="ltr" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة السر" dir="ltr" autocomplete="current-password">
<button class="go" id="tg">دخول المدرّس</button></details>
</section>

<section id="stu" hidden>
<div class="top"><b id="hi"></b><span><span id="ss" class="sub"></span> <button class="lnk" id="out">خروج</button></span></div>
<div class="prog"><b id="pt"></b><div class="bar"><i id="pb"></i></div></div>
<div class="add">
<input type="text" id="ti" placeholder="المهمة (مثلاً: حل 20 مسألة تفاضل)" maxlength="120">
<select id="su"></select>
<input type="date" id="da">
<button class="go" id="ad">أضف المهمة</button>
</div>
<div class="tabs" role="tablist">
<button role="tab" data-t="today">النهارده</button>
<button role="tab" data-t="back">التراكمات<span class="badge" id="bc"></span></button>
<button role="tab" data-t="next">الجاي</button>
</div>
<div id="list"></div>
</section>

<section id="tch" hidden>
<div class="top"><b>متابعة الطلاب</b><button class="lnk" id="tout">خروج</button></div>
<div class="add" style="margin-top:10px">
<input type="text" id="sn" placeholder="اسم الطالب الجديد" maxlength="60">
<button class="go" id="sa">أضف طالب وولّد كود</button>
</div>
<div id="tlist"></div>
</section>
</main>

<script>
/* غيّر القيمتين دول لو مشروعك مختلف */
var CFG={u:'https://xdgbudvnejufhpsiwwyf.supabase.co',k:'sb_publishable_A8kIb7sqUkcVjCVqZvffhg_eopruyEd'};
var $=function(i){return document.getElementById(i)};
var S={tasks:[],cap:3,name:''},code='',tab='today',tok=null,rows=[],pt=0;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function show(w){['login','stu','tch'].forEach(function(i){$(i).hidden=i!==w})}
function p2(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function today(){return ds(new Date())}
function add(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ds(d)}
function diff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function dn(s){return new Date(s+'T00:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

async function api(path,o){
 o=o||{};var h={apikey:CFG.k,'Content-Type':'application/json'};
 if(tok)h.Authorization='Bearer '+tok;
 if(o.pr)h.Prefer=o.pr;
 var r=await fetch(CFG.u+path,{method:o.m||'GET',headers:h,body:o.b?JSON.stringify(o.b):undefined});
 if(!r.ok){var e=new Error('http');e.status=r.status;throw e}
 var t=await r.text();return t?JSON.parse(t):null;
}

/* ===== الطالب ===== */
var SUBJ=['عربي','إنجليزي','لغة ثانية','رياضيات','فيزياء','كيمياء','أحياء','جيولوجيا','تاريخ','جغرافيا','فلسفة','أخرى'];
$('su').innerHTML=SUBJ.map(function(s){return'<option>'+s+'</option>'}).join('');
$('da').value=today();

async function enter(c){
 c=c.trim().toUpperCase();if(!c)return;
 $('le').textContent='';
 try{
  var r=await api('/rest/v1/rpc/get_student',{m:'POST',b:{p_code:c}});
  if(!r||!r.length){$('le').textContent='الكود غلط. اتأكد منه مع مدرّسك.';ls('tp-code',null);show('login');return}
  code=c;S.name=r[0].name;var d=r[0].data||{};S.tasks=d.tasks||[];S.cap=d.cap||3;
  ls('tp-code',code);$('hi').textContent='أهلاً '+S.name;$('ss').textContent='';tab='today';show('stu');render();
 }catch(e){$('le').textContent='تعذّر الاتصال. جرّب تاني.';show('login')}
}
function save(){$('ss').textContent='بيتحفظ...';clearTimeout(pt);pt=setTimeout(push,700)}
async function push(){
 try{
  var ok=await api('/rest/v1/rpc/save_student',{m:'POST',b:{p_code:code,p_data:{tasks:S.tasks,cap:S.cap}}});
  if(ok===false){$('ss').textContent='⚠ ماتحفظش. ارجع ادخل بالكود.';return}
  $('ss').textContent='✓ اتحفظ';
 }catch(e){$('ss').textContent='⚠ ماتحفظش، هنحاول تاني';pt=setTimeout(push,8000)}
}
function row(t,late){
 return '<div class="t'+(t.done?' done':'')+'"><input type="checkbox" data-c="'+esc(t.id)+'"'+(t.done?' checked':'')+' aria-label="تم">'+
 '<div class="tt">'+esc(t.title)+(late?'<span class="late">متأخرة '+late+' يوم</span>':'')+'<br><span class="chip">'+esc(t.subject)+'</span></div>'+
 (late?'<button class="mv" data-m="'+esc(t.id)+'">لليوم</button>':'')+
 '<button class="x" data-d="'+esc(t.id)+'" aria-label="احذف">×</button></div>';
}
function render(){
 var T=today(),all=S.tasks;
 var td=all.filter(function(t){return t.date===T});
 var back=all.filter(function(t){return !t.done&&t.date<T}).sort(function(a,b){return a.date<b.date?-1:1});
 var nx=all.filter(function(t){return t.date>T}).sort(function(a,b){return a.date<b.date?-1:1});
 var n=td.filter(function(t){return t.done}).length;
 $('pt').textContent=td.length?('خلّصت '+n+' من '+td.length+' النهارده'):'مفيش مهام النهارده — أضف أول مهمة';
 $('pb').style.width=(td.length?n/td.length*100:0)+'%';
 $('bc').textContent=back.length||'';$('bc').style.display=back.length?'inline-block':'none';
 document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===tab)});
 var h='';
 if(tab==='today'){
  h=td.length?td.map(function(t){return row(t)}).join(''):'<div class="empty">يومك فاضي. أضف مهمة من فوق.</div>';
 }else if(tab==='back'){
  if(!back.length)h='<div class="empty">مفيش تراكمات. كمّل كده 👏</div>';
  else{
   h='<div class="rescue"><b>عندك '+back.length+' مهمة متراكمة</b><div class="row"><span>أقصى عدد مهام في اليوم:</span><input type="number" id="cap" min="1" max="20" value="'+S.cap+'"><button class="go" id="dist">وزّعها على الأيام الجاية</button></div></div>';
   h+=back.map(function(t){return row(t,diff(t.date,T))}).join('');
  }
 }else{
  if(!nx.length)h='<div class="empty">مفيش مهام جاية لسه.</div>';
  else{var last='';nx.forEach(function(t){if(t.date!==last){last=t.date;h+='<div class="day">'+dn(t.date)+'</div>'}h+=row(t)})}
 }
 $('list').innerHTML=h;
}
function distribute(){
 var T=today(),cap=Math.max(1,parseInt($('cap').value)||3);S.cap=cap;
 var back=S.tasks.filter(function(t){return !t.done&&t.date<T}).sort(function(a,b){return a.date<b.date?-1:1});
 var load={};S.tasks.forEach(function(t){if(!t.done&&t.date>=T)load[t.date]=(load[t.date]||0)+1});
 var d=add(T,1);
 back.forEach(function(t){while((load[d]||0)>=cap)d=add(d,1);t.date=d;load[d]=(load[d]||0)+1});
 save();tab='next';render();
}
$('ad').onclick=function(){
 var v=$('ti').value.trim();if(!v){$('ti').focus();return}
 S.tasks.push({id:Date.now()+''+Math.floor(Math.random()*1000),title:v,subject:$('su').value,date:$('da').value||today(),done:false});
 $('ti').value='';save();
 var d=$('da').value||today();tab=d===today()?'today':(d<today()?'back':'next');render();
};
$('ti').onkeydown=function(e){if(e.key==='Enter')$('ad').click()};
document.querySelector('.tabs').onclick=function(e){var b=e.target.closest('button');if(b){tab=b.dataset.t;render()}};
$('list').onclick=function(e){
 var t=e.target,id;
 if(t.id==='dist'){distribute();return}
 if(id=t.dataset.d){S.tasks=S.tasks.filter(function(x){return x.id!==id})}
 else if(id=t.dataset.m){S.tasks.forEach(function(x){if(x.id===id)x.date=today()});tab='today'}
 else if(id=t.dataset.c){S.tasks.forEach(function(x){if(x.id===id)x.done=t.checked})}
 else return;
 save();render();
};

/* ===== المدرّس ===== */
function stat(ts){
 var T=today(),w=add(T,-6);
 var td=ts.filter(function(t){return t.date===T}),back=ts.filter(function(t){return !t.done&&t.date<T}),wk=ts.filter(function(t){return t.date>=w&&t.date<=T});
 var by={};back.forEach(function(t){by[t.subject]=(by[t.subject]||0)+1});
 return{td:td.length,tdd:td.filter(function(t){return t.done}).length,back:back.length,wk:wk.length,wkd:wk.filter(function(t){return t.done}).length,by:by};
}
function gen(){
 var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',b=new Uint8Array(8),s='';
 crypto.getRandomValues(b);for(var i=0;i<8;i++)s+=A[b[i]%A.length];return s;
}
function trender(){
 if(!rows.length){$('tlist').innerHTML='<div class="empty">لسه مفيش طلاب. أضف أول طالب من فوق.</div>';return}
 var L=rows.map(function(x){var ts=(x.data&&x.data.tasks)||[];return{x:x,s:stat(ts),d:Math.floor((Date.now()-new Date(x.updated_at).getTime())/864e5),n:ts.length}}).sort(function(a,b){return b.s.back-a.s.back});
 var h='<div class="prog"><b>'+L.length+' طالب، منهم '+L.filter(function(o){return o.s.back>0}).length+' عندهم تراكمات</b></div>';
 h+=L.map(function(o){
  var s=o.s,rate=s.wk?Math.round(s.wkd/s.wk*100):0,warn=s.back>=5||(o.n>0&&o.d>=2);
  var subs=Object.keys(s.by).map(function(k){return '<span class="chip">'+esc(k)+' '+s.by[k]+'</span>'}).join(' ');
  return '<div class="t st'+(warn?' warn':'')+'"><div class="tt"><b>'+esc(o.x.name)+'</b>'+(warn?' ⚠️':'')+
  '<div>النهارده: '+s.tdd+' من '+s.td+'، إنجاز الأسبوع: '+rate+'%</div><div class="bar"><i style="width:'+rate+'%"></i></div>'+
  '<div>متراكم: '+s.back+' '+subs+'</div>'+
  '<div style="color:var(--mu)">آخر نشاط: '+(o.n===0?'لسه ما بدأش':(o.d<1?'النهارده':'من '+o.d+' يوم'))+'</div>'+
  '<div style="margin-top:6px">الكود: <span class="cd">'+esc(o.x.code)+'</span> <button class="mini" data-cp="'+esc(o.x.code)+'">انسخ</button><button class="mini" data-del="'+esc(o.x.id)+'" data-nm="'+esc(o.x.name)+'">احذف</button></div>'+
  '</div></div>';
 }).join('');
 $('tlist').innerHTML=h;
}
async function load(){
 try{rows=await api('/rest/v1/students?select=id,code,name,data,updated_at&order=name');trender()}
 catch(e){if(e.status===401||e.status===403){tok=null;$('le').textContent='الجلسة خلصت. ادخل تاني.';show('login')}else{$('tlist').innerHTML='<div class="empty">تعذّر تحميل البيانات.</div>'}}
}
async function tLogin(){
 $('le').textContent='';
 try{
  var r=await api('/auth/v1/token?grant_type=password',{m:'POST',b:{email:$('em').value.trim(),password:$('pw').value}});
  tok=r.access_token;$('pw').value='';show('tch');await load();
 }catch(e){tok=null;$('le').textContent='الإيميل أو كلمة السر غلط، أو مفيش اتصال.'}
}
$('sa').onclick=async function(){
 var n=$('sn').value.trim();if(!n){$('sn').focus();return}
 for(var i=0;i<3;i++){
  try{await api('/rest/v1/students',{m:'POST',b:{code:gen(),name:n},pr:'return=minimal'});$('sn').value='';await load();return}
  catch(e){if(e.status!==409){alert('تعذّرت الإضافة. جرّب تاني.');return}}
 }
};
$('tlist').onclick=async function(e){
 var t=e.target,c=t.dataset.cp,id=t.dataset.del;
 if(c){try{await navigator.clipboard.writeText(c);t.textContent='اتنسخ ✓'}catch(x){prompt('انسخ الكود:',c)}return}
 if(id&&confirm('تحذف '+t.dataset.nm+' وكل مهامه؟')){
  try{await api('/rest/v1/students?id=eq.'+encodeURIComponent(id),{m:'DELETE'});await load()}catch(x){alert('تعذّر الحذف.')}
 }
};

/* ===== الدخول ===== */
$('lg').onclick=function(){enter($('cd').value)};
$('cd').onkeydown=function(e){if(e.key==='Enter')$('lg').click()};
$('tg').onclick=tLogin;
$('pw').onkeydown=function(e){if(e.key==='Enter')tLogin()};
$('out').onclick=function(){ls('tp-code',null);code='';S={tasks:[],cap:3,name:''};$('cd').value='';show('login')};
$('tout').onclick=function(){tok=null;rows=[];show('login')};
var saved=ls('tp-code');if(saved)enter(saved);else show('login');
</script>
</body>
</html>
